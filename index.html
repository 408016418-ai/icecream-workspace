<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>icecream · 冰淇淋工作台</title>
<!-- PWA / 主屏幕图标 -->
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="icecream">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EC4899">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<style>
/* ===== CSS Variables - Clean Modern Theme ===== */
:root {
  --bg: #F5F7FA;
  --card-bg: #FFFFFF;
  --sidebar-bg: #FFFFFF;
  --sidebar-text: #6B7280;
  --sidebar-active-bg: #EC4899;
  --sidebar-active-text: #FFFFFF;
  --sidebar-hover-bg: #F3F4F6;
  --primary: #EC4899;
  --primary-light: #FCE7F3;
  --primary-hover: #DB2777;
  --danger: #EF4444;
  --danger-light: #FEE2E2;
  --warning: #F59E0B;
  --warning-light: #FEF3C7;
  --info: #3B82F6;
  --info-light: #DBEAFE;
  --text: #1F2937;
  --text-secondary: #6B7280;
  --text-muted: #9CA3AF;
  --border: #E5E7EB;
  --border-light: #F3F4F6;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 6px rgba(0,0,0,0.05), 0 2px 4px rgba(0,0,0,0.04);
  --shadow-lg: 0 10px 25px rgba(0,0,0,0.08), 0 4px 10px rgba(0,0,0,0.04);
  --radius: 16px;
  --radius-sm: 12px;
  --radius-xs: 8px;
  --radius-lg: 20px;
  --sidebar-w: 240px;
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ===== Sidebar ===== */
.sidebar {
  width: var(--sidebar-w);
  min-height: 100vh;
  background: var(--sidebar-bg);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
  overflow-y: auto;
  padding: 24px 0;
  border-right: 1px solid var(--border-light);
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 24px 28px;
  margin-bottom: 8px;
}

.logo-icon { font-size: 28px; line-height: 1; }

.logo-text {
  font-size: 20px; font-weight: 700;
  color: var(--text); letter-spacing: -0.5px;
}

.nav-section { padding: 6px 16px; }

.nav-section-title {
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 8px;
  padding: 4px 12px 2px;
}

.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 14px; border-radius: 12px; cursor: pointer;
  transition: all var(--transition); color: var(--sidebar-text);
  font-size: 14px; font-weight: 500; margin-bottom: 2px; text-decoration: none;
}

.nav-item:hover { background: var(--sidebar-hover-bg); color: var(--text); }

.nav-item.active {
  background: var(--sidebar-active-bg); color: var(--sidebar-active-text);
  font-weight: 600;
}

.nav-item .nav-icon { font-size: 20px; width: 24px; text-align: center; flex-shrink: 0; }

.nav-sub { padding-left: 38px; font-size: 13px; }

.nav-divider { height: 1px; background: var(--border-light); margin: 8px 20px; }

/* ===== Main Content ===== */
.main {
  margin-left: var(--sidebar-w); flex: 1;
  padding: 28px 36px 36px; max-width: calc(100vw - var(--sidebar-w));
  min-height: 100vh;
}

.page { display: none; }
.page.active { display: block; animation: fadeIn 0.3s ease; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ===== Top Bar ===== */
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 28px;
}

.top-bar-left {
  display: flex; align-items: center; gap: 12px;
}

.top-bar-title {
  font-size: 24px; font-weight: 700; color: var(--text);
  letter-spacing: -0.3px;
}

.top-bar-right {
  display: flex; align-items: center; gap: 16px;
}

.top-bar-date {
  font-size: 14px; color: var(--text-secondary);
}

.top-bar-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), #F472B6);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 16px; font-weight: 600;
  cursor: pointer;
}

/* ===== Toast ===== */
.toast-container {
  position: fixed; top: 24px; right: 24px; z-index: 300;
  display: flex; flex-direction: column; gap: 8px;
}

.toast {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 12px 18px;
  box-shadow: var(--shadow-lg); font-size: 13px; color: var(--text);
  display: flex; align-items: center; gap: 8px;
  animation: slideIn 0.3s ease;
  min-width: 200px; max-width: 380px;
}

.toast.success { border-left: 3px solid var(--primary); }
.toast.error { border-left: 3px solid var(--danger); }
.toast.info { border-left: 3px solid var(--info); }

@keyframes slideIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
@keyframes slideOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(40px); } }

/* ===== Components ===== */
.page-header {
  margin-bottom: 24px;
  display: flex; align-items: center; justify-content: space-between;
}

.page-title {
  font-size: 22px; font-weight: 700; color: var(--text);
  display: flex; align-items: center; gap: 10px; letter-spacing: -0.3px;
}

.page-subtitle { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }

.card {
  background: var(--card-bg); border-radius: var(--radius-lg);
  padding: 24px; box-shadow: var(--shadow);
  margin-bottom: 20px; border: 1px solid var(--border-light);
  transition: box-shadow var(--transition);
}

.card:hover { box-shadow: var(--shadow-md); }

.card-header {
  font-size: 16px; font-weight: 600; color: var(--text);
  margin-bottom: 18px; display: flex; align-items: center; justify-content: space-between;
}

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

/* ===== Buttons ===== */
.btn {
  padding: 10px 18px; border-radius: var(--radius-xs); border: none;
  cursor: pointer; font-size: 13.5px; font-weight: 500;
  transition: all var(--transition); display: inline-flex; align-items: center; gap: 6px;
  font-family: inherit; line-height: 1.4;
}

.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(236,72,153,0.25); }

.btn-mint { background: var(--primary); color: #fff; }
.btn-mint:hover { background: var(--primary-hover); transform: translateY(-1px); }

.btn-vanilla { background: #F59E0B; color: #fff; }
.btn-vanilla:hover { background: #D97706; }

.btn-blueberry { background: #3B82F6; color: #fff; }
.btn-blueberry:hover { background: #2563EB; }

.btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text-secondary); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }

.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-xs { padding: 4px 10px; font-size: 11px; border-radius: 6px; }

.btn-danger { color: var(--danger); }
.btn-danger:hover { background: var(--danger-light); }

.btn-icon {
  width: 36px; height: 36px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 10px; background: transparent; border: none;
  cursor: pointer; color: var(--text-muted); transition: all var(--transition);
}
.btn-icon:hover { background: var(--border-light); color: var(--text); }

/* ===== Forms ===== */
.form-group { margin-bottom: 16px; }

.form-label {
  display: block; font-size: 13px; font-weight: 500;
  color: var(--text-secondary); margin-bottom: 6px;
}

.form-input, .form-select, .form-textarea {
  width: 100%; padding: 10px 14px; border: 1.5px solid var(--border);
  border-radius: var(--radius-xs); font-size: 14px;
  background: var(--card-bg); color: var(--text);
  transition: all var(--transition); font-family: inherit;
  box-shadow: var(--shadow-sm);
}

.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none; border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(236,72,153,0.1);
}

.form-textarea { resize: vertical; min-height: 70px; }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* ===== Task List ===== */
.task-list { list-style: none; }

.task-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; background: var(--card-bg); border-radius: var(--radius-sm);
  margin-bottom: 6px; border: 1px solid var(--border-light);
  transition: all var(--transition);
}

.task-item:hover { border-color: var(--border); box-shadow: var(--shadow-sm); }

.task-item.completed .task-content { text-decoration: line-through; color: var(--text-muted); }

.task-checkbox {
  width: 22px; height: 22px; border: 2px solid var(--border);
  border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all var(--transition);
}

.task-checkbox.checked {
  background: var(--primary); border-color: var(--primary); color: #fff; font-size: 12px;
}

.task-content { flex: 1; font-size: 14px; min-width: 0; }

.task-deadline {
  font-size: 12px; color: var(--primary); background: var(--primary-light);
  padding: 3px 10px; border-radius: 20px; white-space: nowrap; font-weight: 500;
}

.task-deadline.overdue { color: var(--danger); background: var(--danger-light); }

.task-delete {
  width: 28px; height: 28px; border: none; background: transparent;
  cursor: pointer; color: var(--text-muted); font-size: 16px;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  transition: all var(--transition); flex-shrink: 0;
}

.task-delete:hover { color: var(--danger); background: var(--danger-light); }

.task-drag-handle { cursor: grab; color: var(--text-muted); font-size: 14px; padding: 2px; }
.task-drag-handle:active { cursor: grabbing; }

.sortable-ghost { opacity: 0.4; background: var(--primary-light); }

/* ===== Mood Selector ===== */
.mood-selector { display: flex; gap: 10px; flex-wrap: wrap; }

.mood-option {
  font-size: 30px; cursor: pointer; padding: 10px 14px;
  border-radius: var(--radius-sm); border: 2px solid var(--border-light);
  transition: all var(--transition); background: var(--card-bg);
}

.mood-option:hover { transform: scale(1.15); border-color: var(--border); }
.mood-option.selected { border-color: var(--primary); background: var(--primary-light); transform: scale(1.1); }

/* ===== Stats Cards ===== */
.stat-card {
  background: var(--card-bg); border-radius: var(--radius-lg);
  padding: 24px 28px; box-shadow: var(--shadow);
  border: 1px solid var(--border-light);
  transition: box-shadow var(--transition);
}
.stat-card:hover { box-shadow: var(--shadow-md); }

.stat-value {
  font-size: 36px; font-weight: 800; color: var(--text);
  letter-spacing: -1px; line-height: 1.1;
}

.stat-label { font-size: 13px; color: var(--text-muted); margin-top: 6px; font-weight: 500; }

.stat-icon {
  font-size: 24px; margin-bottom: 12px;
}

/* ===== Charts ===== */
.chart-container { position: relative; height: 260px; width: 100%; }
.chart-container-lg { position: relative; height: 340px; width: 100%; }

/* ===== Tabs ===== */
.tabs {
  display: flex; gap: 4px; background: var(--border-light);
  padding: 4px; border-radius: var(--radius-sm); margin-bottom: 20px;
}

.tab {
  padding: 9px 18px; border-radius: 8px; cursor: pointer;
  font-size: 13.5px; font-weight: 500; color: var(--text-secondary);
  transition: all var(--transition); border: none; background: transparent;
}

.tab.active { background: var(--card-bg); color: var(--text); box-shadow: var(--shadow-sm); font-weight: 600; }
.tab:hover:not(.active) { color: var(--text); }

/* ===== Week Badge ===== */
.week-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--primary-light);
  padding: 10px 20px; border-radius: 50px; font-size: 15px; font-weight: 600;
  color: var(--primary);
}

.week-number { font-size: 38px; font-weight: 800; color: var(--primary); line-height: 1; }

/* ===== Empty State ===== */
.empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); }
.empty-state .icon { font-size: 48px; margin-bottom: 14px; color: var(--text-muted); }
.empty-state p { font-size: 14px; }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.35); z-index: 200;
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.2s ease;
}

.modal {
  background: var(--card-bg); border-radius: var(--radius-lg);
  padding: 28px; width: 90%; max-width: 540px;
  box-shadow: var(--shadow-lg); max-height: 82vh; overflow-y: auto;
}

.modal-title { font-size: 19px; font-weight: 700; margin-bottom: 18px; color: var(--text); }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }

/* ===== Report ===== */
.report-content {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 18px; font-size: 14px;
  line-height: 1.8; min-height: 200px; white-space: pre-wrap;
}

.report-content:focus { outline: none; border-color: var(--primary); }

/* ===== Tags ===== */
.tag {
  display: inline-block; padding: 4px 12px; border-radius: 20px;
  font-size: 12px; font-weight: 500;
}

.tag-income { background: #FCE7F3; color: #9D174D; }
.tag-expense { background: #FEE2E2; color: #991B1B; }
.tag-mint { background: #FCE7F3; color: #9D174D; }
.tag-strawberry { background: #FEE2E2; color: #991B1B; }
.tag-blueberry { background: #DBEAFE; color: #1E40AF; }
.tag-vanilla { background: #FEF3C7; color: #92400E; }

/* ===== Table ===== */
.data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }

.data-table th {
  text-align: left; padding: 12px 14px; color: var(--text-muted);
  font-weight: 600; border-bottom: 2px solid var(--border-light);
  font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;
}

.data-table td { padding: 12px 14px; border-bottom: 1px solid var(--border-light); }
.data-table tr:hover td { background: rgba(0,0,0,0.015); }

/* ===== Recipe Card ===== */
.recipe-card {
  background: linear-gradient(135deg, #fff, #FCE7F3);
  border: 1px solid #FBCFE8; border-radius: var(--radius);
  padding: 18px 22px; margin-bottom: 12px;
}

.recipe-meal { font-size: 15px; font-weight: 600; color: #9D174D; }
.recipe-desc { font-size: 13.5px; color: var(--text); margin-top: 4px; }
.recipe-cal { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

/* ===== Assistant ===== */
.assistant-chat { max-height: 420px; overflow-y: auto; margin-bottom: 14px; }

.assistant-msg {
  padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 8px;
  font-size: 13.5px; line-height: 1.6;
}

.assistant-msg.bot { background: #FDF2F8; color: var(--text); border: 1px solid #FCE7F3; }
.assistant-msg.user { background: #EEF2FF; color: var(--text); text-align: right; border: 1px solid #DBEAFE; }

.assistant-input-row { display: flex; gap: 10px; }
.assistant-input-row .form-input { flex: 1; }

/* ===== List Item Hover ===== */
.list-item {
  padding: 10px 0; border-bottom: 1px solid var(--border-light);
  display: flex; align-items: center; gap: 10px; font-size: 13.5px;
  transition: background 0.15s;
}
.list-item:hover { background: rgba(0,0,0,0.015); }

/* ===== Confirm Dialog ===== */
.confirm-dialog {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  background: var(--card-bg); border-radius: var(--radius-lg);
  padding: 24px 28px; box-shadow: var(--shadow-lg); z-index: 250;
  text-align: center; min-width: 300px;
}
.confirm-dialog p { margin-bottom: 18px; font-size: 14.5px; }
.confirm-dialog .btn { margin: 0 5px; }

/* ===== Photo Upload ===== */
.photo-upload-area {
  border: 2px dashed var(--border);
  border-radius: var(--radius-sm);
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: all var(--transition);
  background: var(--bg);
  min-height: 90px;
  display: flex; align-items: center; justify-content: center;
}
.photo-upload-area:hover { border-color: var(--primary); background: #FDF2F8; }
.photo-placeholder { color: var(--text-muted); font-size: 26px; line-height: 1.4; display: flex; flex-direction: column; align-items: center; }

/* ===== Outfit Grid ===== */
.outfit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 18px; }

.outfit-card {
  background: var(--card-bg); border: 1px solid var(--border-light); border-radius: var(--radius-lg);
  overflow: hidden; transition: all var(--transition);
}
.outfit-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }

.outfit-photo {
  width: 100%; height: 240px; overflow: hidden; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
}
.outfit-photo img { width: 100%; height: 100%; object-fit: cover; }
.outfit-photo-empty { flex-direction: column; gap: 6px; color: var(--text-muted); font-size: 32px; }

.outfit-info { padding: 14px 16px; }

/* ===== Wardrobe Grid ===== */
.wardrobe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }

.wardrobe-card {
  background: var(--card-bg); border: 1px solid var(--border-light); border-radius: var(--radius);
  overflow: hidden; transition: all var(--transition); position: relative;
}
.wardrobe-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }

.wardrobe-photo {
  width: 100%; height: 150px; overflow: hidden; background: var(--bg);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.wardrobe-photo img { width: 100%; height: 100%; object-fit: cover; }
.wardrobe-photo-empty { font-size: 44px; color: var(--text-muted); }

.wardrobe-info {
  padding: 10px 12px; font-size: 12px; color: var(--text);
  position: relative; min-height: 38px; display: flex; align-items: center;
}

/* ===== Lightbox ===== */
.lightbox-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.88); z-index: 300;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.lightbox-overlay img { max-width: 92vw; max-height: 92vh; border-radius: 10px; box-shadow: 0 8px 50px rgba(0,0,0,0.6); }

/* ===== Responsive Form Row ===== */
.form-row-responsive {
  display: flex;
  gap: 14px;
  align-items: flex-end;
  flex-wrap: wrap;
}
.form-row-responsive > .form-group {
  flex: 1 1 0;
  min-width: 130px;
  margin-bottom: 0;
}

@media (max-width: 768px) {
  .form-row-responsive {
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
  }
  .form-row-responsive > .form-group {
    min-width: auto;
    flex: 1 1 auto;
  }
}

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .sidebar {
    width: 72px; min-height: 100vh; position: fixed;
    flex-direction: column; padding: 16px 8px; gap: 0; overflow-x: visible;
    border-right: 1px solid var(--border-light);
  }
  .logo { display: none; }
  .nav-section { display: flex; flex-direction: column; gap: 4px; padding: 0; align-items: center; }
  .nav-section-title { display: none; }
  .nav-divider { display: none; }
  .nav-item {
    padding: 10px 0; font-size: 10px; white-space: nowrap;
    flex-direction: column; gap: 4px; width: 56px; align-items: center;
    border-radius: 14px;
  }
  .nav-item .nav-icon-svg { width: 24px; height: 24px; }
  .nav-sub { padding-left: 0; font-size: 10px; }
  body { flex-direction: row; }
  .main { margin-left: 72px; padding: 16px; max-width: calc(100vw - 72px); }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .form-row { grid-template-columns: 1fr; }
  .modal { width: 95%; }
  .page-title { font-size: 20px; }
  .stat-value { font-size: 28px; }
  .top-bar { flex-direction: row; align-items: center; gap: 8px; }
  .top-bar-title { font-size: 20px; }
  .card { padding: 16px; }
}
.nav-icon-svg {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  stroke-width: 2;
}

  width: 28px;

<script>
/* ================================================================
   icecream 工作台 v2 — 实时交互引擎
   ================================================================ */

// ===== Toast =====
const Toast = {
  show(msg, type='success', duration=2000) {
    const container = document.getElementById('toastContainer');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    const icons = { success: '✅', error: '❌', info: 'ℹ️' };
    el.innerHTML = `<span>${icons[type] || '✅'}</span> ${msg}`;
    container.appendChild(el);
    setTimeout(() => {
      el.style.animation = 'slideOut 0.25s ease forwards';
      setTimeout(() => el.remove(), 250);
    }, duration);
  }
};

// ===== Confirm Dialog =====
function showConfirm(msg, onYes) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="confirm-dialog">
      <p>${msg}</p>
      <button class="btn btn-outline confirm-no">取消</button>
      <button class="btn btn-primary confirm-yes">确定</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('.confirm-no').onclick = () => overlay.remove();
  overlay.querySelector('.confirm-yes').onclick = () => { overlay.remove(); onYes(); };
}

// ===== Modal =====
function showModal(title, bodyHTML, onSave) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-title">${title}</div>
      <div class="modal-body">${bodyHTML}</div>
      <div class="modal-actions">
        <button class="btn btn-outline modal-cancel">取消</button>
        <button class="btn btn-primary modal-save">保存</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('.modal-cancel').onclick = () => overlay.remove();
  overlay.querySelector('.modal-save').onclick = () => {
    if (onSave(overlay) !== false) overlay.remove();
  };
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  return overlay;
}

// ===== DataStore =====
const DataStore = {
  _cache: {},
  get(key) {
    if (this._cache[key] !== undefined) return this._cache[key];
    try {
      const raw = localStorage.getItem('icecream_' + key);
      this._cache[key] = raw ? JSON.parse(raw) : this._defaults(key);
      return this._cache[key];
    } catch(e) { return this._defaults(key); }
  },
  set(key, val) {
    this._cache[key] = val;
    localStorage.setItem('icecream_' + key, JSON.stringify(val));
  },
  _defaults(key) {
    const map = {
      tasks: [], daily_review: [], finance: [], outfits: [],
      wardrobe: [], diet: [], language: [], fitness: [],
      weekly_reports: [], settings: {}
    };
    return map[key] !== undefined ? map[key] : [];
  },
  clearCache() { this._cache = {}; }
};

// ===== Utils =====
const U = {
  uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); },
  today() { return new Date().toISOString().split('T')[0]; },
  now() { return new Date(); },
  fmtDate(d) {
    const dd = new Date(d + 'T00:00:00');
    return dd.toLocaleDateString('zh-CN', { month:'short', day:'numeric', weekday:'short' });
  },
  fmtDateFull(d) {
    const dd = new Date(d + 'T00:00:00');
    return dd.toLocaleDateString('zh-CN');
  },
  getWeekNumber(d) {
    const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay() || 7));
    const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
    return Math.ceil(((date - yearStart) / 86400000 + 1) / 7);
  },
  getWeekRange(d) {
    const day = d.getDay() || 7;
    const monday = new Date(d);
    monday.setDate(d.getDate() - day + 1);
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    return { start: monday.toISOString().split('T')[0], end: sunday.toISOString().split('T')[0] };
  },
  isOverdue(deadline) { return deadline && deadline < this.today(); },
  moodEmoji: { '😄': '超开心', '🙂': '还不错', '😐': '一般般', '😔': '有点丧', '😤': '很烦躁' },
  esc(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
};

// ===== Chart Manager — 智能 update 而非 destroy =====
const ChartMgr = {
  _charts: {},
  getOrCreate(canvasId, createFn) {
    // 如果 chart 存在且 canvas 还在 DOM 中，直接返回
    if (this._charts[canvasId]) {
      const c = this._charts[canvasId];
      if (c.canvas && document.contains(c.canvas)) return c;
      c.destroy();
    }
    const chart = createFn();
    if (chart) this._charts[canvasId] = chart;
    return chart;
  },
  update(canvasId, data, labels) {
    const chart = this._charts[canvasId];
    if (!chart) return;
    if (data) chart.data.datasets[0].data = data;
    if (labels) chart.data.labels = labels;
    if (data && chart.data.datasets[1]) chart.data.datasets[1].data = data.length === chart.data.datasets[0].data.length ? chart.data.datasets[1].data : data;
    chart.update('none'); // 'none' = no animation, instant update
  },
  updateMulti(canvasId, datasetsData) {
    const chart = this._charts[canvasId];
    if (!chart) return;
    datasetsData.forEach((data, i) => { if (chart.data.datasets[i]) chart.data.datasets[i].data = data; });
    chart.update('none');
  },
  destroyAll() {
    Object.values(this._charts).forEach(c => { try { c.destroy(); } catch(e) {} });
    this._charts = {};
  }
};

// ===== Render helper =====

}

/* ================================================================
   Router — 保存当前渲染函数引用，支持刷新
   ================================================================ */
const Router = {
  routes: {},
  _currentRoute: '',
  _currentRenderFn: null,

  add(pattern, handler) {
    this.routes[pattern] = handler;
  },

  navigate(hash, forceRender = false) {
    const path = hash.replace(/^#/, '') || '/home';
    if (path === this._currentRoute && !forceRender) return;

    ChartMgr.destroyAll();
    this._currentRoute = path;

    // Update nav active
    document.querySelectorAll('.nav-item').forEach(el => {
      const r = el.dataset.route;
      el.classList.toggle('active', r === path || (path.startsWith(r + '/') && r !== '/home') || (path === '/home' && r === '/home'));
    });

    const handler = this.routes[path] || this.routes['/home'];
    this._currentRenderFn = handler;
    document.getElementById('mainContent').innerHTML = '';
    if (handler) handler();
  },

  // 🔥 核心：刷新当前页面，不改变路由
  refresh() {
    if (this._currentRenderFn) {
      ChartMgr.destroyAll();
      document.getElementById('mainContent').innerHTML = '';
      this._currentRenderFn();
    }
  },

  init() {
    window.addEventListener('hashchange', () => this.navigate(location.hash));
    this.navigate(location.hash || '#/home');
  }
};

function renderHomeCharts() {
  const reviews = DataStore.get('daily_review');
  const recent = [...reviews].sort((a,b) => a.date.localeCompare(b.date)).slice(-30);
  const moodMap = { '😄': 5, '🙂': 4, '😐': 3, '😔': 2, '😤': 1 };
  const labels = recent.map(r => r.date.slice(5));

  // 情绪曲线
  ChartMgr.getOrCreate('moodChart', () => new Chart(document.getElementById('moodChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: '情绪', data: recent.map(r => moodMap[r.mood] || null),
        borderColor: '#FF8FA3', backgroundColor: 'rgba(255,143,163,0.15)',
        fill: true, tension: 0.4, pointBackgroundColor: '#FF8FA3', pointRadius: 4, spanGaps: true
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { min: 0.5, max: 5.5, ticks: { stepSize: 1, callback: v => ['','😤','😔','😐','🙂','😄'][v] || '' } } }
    }
  }));

  // 起床时间曲线
  const toMinutes = t => t ? parseInt(t.split(':')[0]) * 60 + parseInt(t.split(':')[1]) : null;
  ChartMgr.getOrCreate('wakeChart', () => new Chart(document.getElementById('wakeChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: '起床', data: recent.map(r => toMinutes(r.wakeTime)),
        borderColor: '#FFD6A5', backgroundColor: 'rgba(255,214,165,0.15)',
        fill: true, tension: 0.4, pointBackgroundColor: '#FFD6A5', pointRadius: 4, spanGaps: true
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { min: 0, max: 720, ticks: { stepSize: 60, callback: v => Math.floor(v/60) + ':00' } } }
    }
  }));

  // 入睡时间曲线
  ChartMgr.getOrCreate('sleepChart', () => new Chart(document.getElementById('sleepChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: '入睡', data: recent.map(r => toMinutes(r.sleepTime)),
        borderColor: '#9BB5CE', backgroundColor: 'rgba(155,181,206,0.15)',
        fill: true, tension: 0.4, pointBackgroundColor: '#9BB5CE', pointRadius: 4, spanGaps: true
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { min: 1080, max: 1440, ticks: { stepSize: 60, callback: v => Math.floor(v/60) + ':00' } } }
    }
  }));
}

        <tbody id="financeTableBody">
          ${[...records].sort((a,b) => b.date.localeCompare(a.date)).slice(0, 20).map(r => `
            <tr>
              <td>${r.date}</td>
              <td><span class="tag ${r.type === 'income' ? 'tag-income' : 'tag-expense'}">${r.type === 'income' ? '收入' : '支出'}</span></td>
              <td>${U.esc(r.category)}</td>
              <td style="color:${r.type === 'income' ? '#2E7D32' : '#C62828'}; font-weight:600;">${r.type === 'income' ? '+' : '-'}¥${r.amount.toFixed(2)}</td>
              <td style="color:var(--text-muted);">${U.esc(r.note || '-')}</td>
              <td><button class="btn-icon" onclick="App.deleteFinanceRecord('${r.id}')">×</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `);

  setTimeout(() => renderFinanceCharts(), 50);
}

function renderFinanceCharts() {
  const records = DataStore.get('finance');
  const thisMonth = U.today().slice(0, 7);
  const monthRecords = records.filter(r => r.date.startsWith(thisMonth));

  const expenseByCat = {};
  monthRecords.filter(r => r.type === 'expense').forEach(r => {
    expenseByCat[r.category] = (expenseByCat[r.category] || 0) + r.amount;
  });

  // Pie
  const pieLabels = Object.keys(expenseByCat);
  const pieColors = ['#FF8FA3','#FFB3C1','#FFD6A5','#FFE8CC','#7EC8A0','#A8DFC0','#9BB5CE','#B8CFE0','#D7CCC8'];
  ChartMgr.getOrCreate('expensePieChart', () => new Chart(document.getElementById('expensePieChart'), {
    type: 'doughnut',
    data: {
      labels: pieLabels,
      datasets: [{ data: pieLabels.map(k => expenseByCat[k]), backgroundColor: pieColors.slice(0, pieLabels.length) }]
    },
    options: { responsive: true, maintainAspectRatio: false }
  }));

  // Trend
  const days = [];
  const d = new Date();
  for (let i = 29; i >= 0; i--) {
    const dd = new Date(d); dd.setDate(dd.getDate() - i);
    days.push(dd.toISOString().split('T')[0]);
  }
  ChartMgr.getOrCreate('financeTrendChart', () => new Chart(document.getElementById('financeTrendChart'), {
    type: 'bar',
    data: {
      labels: days.map(d => d.slice(5)),
      datasets: [
        { label: '收入', data: days.map(day => records.filter(r => r.date === day && r.type === 'income').reduce((s,r) => s + r.amount, 0)), backgroundColor: '#7EC8A0', borderRadius: 4 },
        { label: '支出', data: days.map(day => records.filter(r => r.date === day && r.type === 'expense').reduce((s,r) => s + r.amount, 0)), backgroundColor: '#FF8FA3', borderRadius: 4 }
      ]
    },
    options: { responsive: true, maintainAspectRatio: false }
  }));
}

function renderLanguageChart() {
  const records = DataStore.get('language');
  const days = [];
  const d = new Date();
  for (let i = 29; i >= 0; i--) {
    const dd = new Date(d); dd.setDate(dd.getDate() - i);
    days.push(dd.toISOString().split('T')[0]);
  }
  ChartMgr.getOrCreate('langChart', () => new Chart(document.getElementById('langChart'), {
    type: 'bar',
    data: {
      labels: days.map(d => d.slice(5)),
      datasets: [
        { label: '🇬🇧 英语', data: days.map(day => records.filter(r => r.date === day && r.language === 'english').reduce((s,r) => s + r.duration, 0)), backgroundColor: '#3B82F6', borderRadius: 4 },
        { label: '🇯🇵 日语', data: days.map(day => records.filter(r => r.date === day && r.language === 'japanese').reduce((s,r) => s + r.duration, 0)), backgroundColor: '#EC4899', borderRadius: 4 }
      ]
    },
    options: { responsive: true, maintainAspectRatio: false }
  }));
}

/* ================================================================
   🔥 App — 所有操作函数集中管理，操作后直接局部刷新
   ================================================================ */
const App = {
  // ===== 首页操作 =====
  selectMood(el) {
    document.querySelectorAll('.mood-option').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    const moodInput = document.getElementById('moodInput');
    if (moodInput) moodInput.value = el.dataset.mood;
  },

  // 起床时间独立保存
  saveWakeTime(e) {
    e.preventDefault();
    const form = e.target;
    this._upsertReview({ wakeTime: form.wakeTime.value });
    Toast.show('起床时间已保存');
    Router.refresh();
  },

  // 睡觉时间独立保存
  saveSleepTime(e) {
    e.preventDefault();
    const form = e.target;
    this._upsertReview({ sleepTime: form.sleepTime.value });
    Toast.show('睡觉时间已保存');
    Router.refresh();
  },

  // 心情点击即保存
  selectMoodAndSave(el, mood) {
    let reviews = DataStore.get('daily_review');
    let r = reviews.find(r => r.date === U.today());
    if (!r) { r = { date: U.today(), mood: '', wakeTime: '', sleepTime: '' }; reviews.push(r); }
    r.mood = mood;
    DataStore.set('daily_review', reviews);
    Toast.show('心情已记录 ' + mood);
    Router.refresh();
  },

  // 刷新待办回顾
  refreshTodoReview() { Router.refresh(); },

  // 通用 upsert
  _upsertReview(fields) {
    let reviews = DataStore.get('daily_review');
    let r = reviews.find(r => r.date === U.today());
    if (!r) { r = { date: U.today(), mood: '', wakeTime: '', sleepTime: '' }; reviews.push(r); }
    Object.assign(r, fields);
    DataStore.set('daily_review', reviews);
  },

  deleteReview(date) {
    showConfirm('确定删除这条复盘记录吗？', () => {
      let reviews = DataStore.get('daily_review');
      reviews = reviews.filter(r => r.date !== date);
      DataStore.set('daily_review', reviews);
      Toast.show('复盘已删除');
      Router.refresh();
    });
  },

  // ===== 智能助手对话 =====
  sendAssistantMsg() {
    const input = document.getElementById('assistantInput');
    if (!input) return;
    const msg = input.value.trim();
    if (!msg) return;
    const chat = document.getElementById('assistantChat');
    chat.innerHTML += `<div class="assistant-msg user">${U.esc(msg)}</div>`;
    input.value = '';

    let reply = '';
    const lower = msg.toLowerCase();

    if (lower.includes('周报')) {
      reply = '正在为你生成周报...';
      setTimeout(() => App.generateWeeklyReport(), 500);
    } else if (lower.includes('食材') || lower.includes('食谱')) {
      const match = msg.match(/[：:]\s*(.+)/);
      if (match) {
        reply = '已识别食材，正在跳转到食谱生成器...';
        setTimeout(() => { Router.navigate('#/life/diet'); setTimeout(() => App.switchDietTab('recipe'), 200); }, 500);
      } else {
        reply = '请告诉我你有哪些食材，格式如「食材：鸡蛋, 番茄, 鸡胸肉」';
      }
    } else if (lower.includes('支出') || lower.includes('记账') || lower.includes('财务')) {
      const records = DataStore.get('finance');
      const thisMonth = U.today().slice(0, 7);
      const monthExpense = records.filter(r => r.date.startsWith(thisMonth) && r.type === 'expense').reduce((s,r) => s + r.amount, 0);
      reply = `本月支出总计：¥${monthExpense.toFixed(2)}。点击左侧「记账」查看详细分类。`;
    } else if (lower.includes('学习') || lower.includes('语言')) {
      const lang = DataStore.get('language');
      const en = lang.filter(r => r.language === 'english').reduce((s,r) => s + r.duration, 0);
      const jp = lang.filter(r => r.language === 'japanese').reduce((s,r) => s + r.duration, 0);
      reply = `📚 学习统计：英语累计 ${en} 分钟，日语累计 ${jp} 分钟。继续加油！💪`;
    } else if (lower.includes('健康') || lower.includes('体重') || lower.includes('运动')) {
      const fitness = DataStore.get('fitness');
      const latest = [...fitness].sort((a,b) => b.date.localeCompare(a.date))[0];
      if (latest) {
        reply = `最近记录 (${latest.date})：${latest.weight ? '体重 ' + latest.weight + 'kg' : ''} ${latest.exerciseCalories ? '运动消耗 ' + latest.exerciseCalories + 'kcal' : ''}`;
      } else {
        reply = '还没有健康数据，快去「运动健康」页面记录吧！';
      }
    } else {
      reply = '收到！你可以试试：\n• "生成本周周报"\n• "食材：鸡蛋, 番茄"\n• "查看本月支出"\n• "学习统计"\n• "健康数据"';
    }

    chat.innerHTML += `<div class="assistant-msg bot">${reply.replace(/\n/g, '<br>')}</div>`;
    chat.scrollTop = chat.scrollHeight;
  },

  // ===== 工作任务操作 =====
  addTask(e) {
    e.preventDefault();
    const form = e.target;
    const tasks = DataStore.get('tasks');
    tasks.push({
      id: U.uid(), content: form.content.value,
      deadline: form.deadline.value || null, completed: false,
      createdAt: U.today(), order: tasks.length
    });
    DataStore.set('tasks', tasks);
    form.reset();
    Toast.show('任务已添加');
    Router.refresh();
  },

  toggleTask(id) {
    let tasks = DataStore.get('tasks');
    const t = tasks.find(t => t.id === id);
    if (t) { t.completed = !t.completed; DataStore.set('tasks', tasks); Toast.show(t.completed ? '任务已完成 ✅' : '任务已恢复'); Router.refresh(); }
  },

  deleteTask(id) {
    showConfirm('确定删除这个任务吗？', () => {
      let tasks = DataStore.get('tasks');
      tasks = tasks.filter(t => t.id !== id);
      DataStore.set('tasks', tasks);
      Toast.show('任务已删除');
      Router.refresh();
    });
  },

  // ===== 周报操作 =====
  generateWeeklyReport() {
    const weekRange = U.getWeekRange(U.now());
    const tasks = DataStore.get('tasks');
    const weekTasks = tasks.filter(t => t.createdAt >= weekRange.start && t.createdAt <= weekRange.end);
    const doneCount = weekTasks.filter(t => t.completed).length;
    const totalCount = weekTasks.length;
    let content = `📊 工作周报 (${weekRange.start} ~ ${weekRange.end})\n\n📈 本周概览\n- 总任务数：${totalCount}\n- 已完成：${doneCount}\n- 完成率：${totalCount > 0 ? Math.round(doneCount/totalCount*100) : 0}%\n\n📋 任务详情\n`;
    weekTasks.forEach((t, i) => { content += `${i+1}. [${t.completed ? '✅' : '⬜'}] ${t.content}`; if (t.deadline) content += ` (截止: ${t.deadline})`; content += '\n'; });
    if (weekTasks.length === 0) content += '本周暂无任务记录。\n';
    showModal('生成周报', `<div class="form-group"><label class="form-label">周报内容（可编辑）</label><div class="report-content" contenteditable="true" id="reportEditor">${U.esc(content)}</div></div>`, (overlay) => {
      const reports = DataStore.get('weekly_reports');
      reports.push({ id: U.uid(), weekStart: weekRange.start, weekEnd: weekRange.end, content: overlay.querySelector('#reportEditor').innerText, createdAt: U.today() });
      DataStore.set('weekly_reports', reports);
      Toast.show('周报已生成！');
      Router.refresh();
    });
  },

  editReport(id) {
    const reports = DataStore.get('weekly_reports');
    const report = reports.find(r => r.id === id);
    if (!report) return;
    showModal('编辑周报', `<div class="form-group"><label class="form-label">${report.weekStart} ~ ${report.weekEnd}</label><div class="report-content" contenteditable="true" id="reportEditor">${U.esc(report.content)}</div></div>`, (overlay) => {
      report.content = overlay.querySelector('#reportEditor').innerText;

        { name: '西兰花鸡胸意面', cals: 420, needs: ['鸡胸肉', '西兰花', '意面'], steps: '1. 意面煮熟，西兰花焯水；2. 鸡胸肉煎熟切条；3. 橄榄油炒蒜末，加意面西兰花鸡肉翻炒；4. 加盐黑胡椒调味。' },
        { name: '杂粮粥+小菜', cals: 280, needs: ['米', '蔬菜'], steps: '1. 杂粮米提前泡2小时；2. 加6倍水大火煮沸转小火熬40分钟；3. 蔬菜切丝加盐醋凉拌做小菜；4. 粥熬至粘稠出锅。' },
        { name: '蒜蓉炒青菜+煎蛋', cals: 260, needs: ['鸡蛋', '青菜'], steps: '1. 青菜洗净沥干，蒜切末；2. 热油爆香蒜末，下青菜大火翻炒1分钟加盐出锅；3. 煎一个太阳蛋搭配。' },
        { name: '番茄鸡肉汤', cals: 270, needs: ['番茄', '鸡胸肉'], steps: '1. 鸡胸肉切丁焯水；2. 番茄炒出汁加水煮沸；3. 加鸡肉丁煮10分钟；4. 加盐、黑胡椒、罗勒调味。' },
        { name: '蔬菜鸡蛋炒面', cals: 380, needs: ['鸡蛋', '蔬菜', '面条'], steps: '1. 面条煮熟过凉水沥干；2. 鸡蛋炒散盛出；3. 炒蔬菜至断生加面条翻炒；4. 加酱油蚝油鸡蛋翻匀。' },
      ]
    };
    function matchRecipes(recipes, ingredients, topN) {
      const scored = recipes.map(r => {
        const score = r.needs.filter(n => ingredients.some(i => i.includes(n) || n.includes(i))).length;
        const miss = r.needs.filter(n => !ingredients.some(i => i.includes(n) || n.includes(i))).length;
        return { ...r, score, miss };
      });
      scored.sort((a, b) => b.score - a.score || a.miss - b.miss);
      const top = scored.filter(s => s.score > 0);
      const rest = scored.filter(s => s.score === 0);
      const candidates = [...top, ...rest.slice(0, Math.max(0, topN - top.length))];
      for (let i = candidates.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [candidates[i], candidates[j]] = [candidates[j], candidates[i]]; }
      return candidates.slice(0, topN);
    }
    const breakfasts = matchRecipes(recipeDB.breakfast, ingredients, 3);
    const lunches = matchRecipes(recipeDB.lunch, ingredients, 3);
    const dinners = matchRecipes(recipeDB.dinner, ingredients, 3);
    const plans = [];
    for (let i = 0; i < 3; i++) {
      plans.push({ index: i+1, breakfast: breakfasts[i]||breakfasts[0], lunch: lunches[i]||lunches[0], dinner: dinners[i]||dinners[0], totalCals: (breakfasts[i]||breakfasts[0]).cals + (lunches[i]||lunches[0]).cals + (dinners[i]||dinners[0]).cals });

    }
  },

  switchRecipePlan(idx) {
    document.querySelectorAll('.recipe-plan').forEach((el, i) => el.style.display = i === idx ? 'block' : 'none');
    document.querySelectorAll('.recipe-plan-tab').forEach((el, i) => el.classList.toggle('active', i === idx));

      records = records.filter(r => r.id !== id);
      DataStore.set('language', records);
      Toast.show('记录已删除');
      Router.refresh();
    });
  },

  // ===== 运动健康操作（体重 / 三围月度 / 运动 独立） =====
  // 体重每日记录
  addWeightRecord(e) {
    e.preventDefault();
    const form = e.target;
    const records = DataStore.get('fitness');
    records.push({ id: U.uid(), date: form.date.value, weight: parseFloat(form.weight.value) || null });
    DataStore.set('fitness', records);
    form.reset();
    form.date.value = U.today();
    Toast.show('体重已记录 ⚖️');
    Router.refresh();
  },

  // 三围月度维护
  addBodyRecord(e) {
    e.preventDefault();
    const form = e.target;
    const records = DataStore.get('fitness');
    // 检查当月是否已有三围记录，有则更新
    const month = form.month.value;
    const existing = records.find(r => r.date === month && r.bust);
    if (existing) {
      existing.bust = parseFloat(form.bust.value);
      existing.waist = parseFloat(form.waist.value);
      existing.hip = parseFloat(form.hip.value);
      Toast.show('三围数据已更新 📏');
    } else {
      records.push({ id: U.uid(), date: month, bust: parseFloat(form.bust.value), waist: parseFloat(form.waist.value), hip: parseFloat(form.hip.value) });
      Toast.show('三围数据已保存 📏');
    }
    DataStore.set('fitness', records);
    form.reset();
    form.month.value = U.today().slice(0,7);
    Router.refresh();
  },

  addExerciseRecord(e) {
    e.preventDefault();
    const form = e.target;
    const records = DataStore.get('fitness');
    records.push({ id: U.uid(), date: form.date.value, exerciseCalories: parseInt(form.exerciseCalories.value) || 0, exerciseType: form.exerciseType.value });
    DataStore.set('fitness', records);
    form.reset();
    form.date.value = U.today();
    Toast.show('运动打卡成功 🔥');
    Router.refresh();
  },

  deleteFitnessRecord(id) {
    showConfirm('确定删除这条记录吗？', () => {
      let records = DataStore.get('fitness');
      records = records.filter(r => r.id !== id);
      DataStore.set('fitness', records);
      Toast.show('记录已删除');
      Router.refresh();
    });
  },

  // ===== 数据导出导入 =====
  exportAllData() {
    const data = {};
    ['tasks','daily_review','finance','outfits','wardrobe','diet','language','fitness','weekly_reports'].forEach(k => {
      data[k] = DataStore.get(k);
    });
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `icecream_backup_${U.today()}.json`;
    a.click(); URL.revokeObjectURL(url);
    Toast.show('数据导出成功');
  },

  importDataPrompt() {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.json';
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          Object.entries(data).forEach(([k, v]) => { if (Array.isArray(v)) DataStore.set(k, v); });
          DataStore.clearCache();
          Toast.show('数据导入成功！');
          Router.refresh();
        } catch(err) { Toast.show('导入失败，请检查文件格式', 'error'); }
      };
      reader.readAsText(file);
    };
    input.click();
  }
};

/* ================================================================
   Register Routes & Init
   ================================================================ */
Router.add('/home', renderHome);
Router.add('/work', renderWork);
Router.add('/work/report', renderWorkReport);
Router.add('/life', renderFinance);
Router.add('/life/outfit', renderOutfit);
Router.add('/life/diet', renderDiet);
Router.add('/health', renderHealth);
Router.add('/learn', renderLanguage);
Router.add('/assistant', renderAssistant);

Router.init();
</script>
</body>
